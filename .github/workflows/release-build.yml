name: USDB Explorer Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: usdb-explorer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/ci.yml
  release:
    needs: tests
    if: github.repository == 'buckyos/usdb-explorer'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      security_matrix: ${{ steps.security.outputs.matrix }}
      source_revision: ${{ steps.version.outputs.revision }}
    permissions:
      contents: write
      packages: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate independent version and frozen build image
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[a-z0-9.]+)?', tag):
              raise SystemExit('Invalid public service tag')
          if subprocess.check_output(['git', 'cat-file', '-t', 'refs/tags/' + tag], text=True).strip() != 'tag':
              raise SystemExit('Use an annotated public service release tag')
          lock = json.load(open('explorer/assets/images.lock.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + tag.removeprefix('v') + '\n')
              output.write('go_image=' + lock['images']['go']['reference'] + '\n')
              output.write('revision=' + subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() + '\n')
          PY
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the public gateway independently of node images
        id: gateway
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: explorer/assets/Dockerfile.gateway
          platforms: linux/amd64
          push: true
          tags: ghcr.io/buckyos/usdb-explorer-gateway:${{ github.ref_name }}
          build-args: GO_IMAGE=${{ steps.version.outputs.go_image }}
          labels: |
            org.opencontainers.image.source=https://github.com/buckyos/usdb-explorer
            org.opencontainers.image.revision=${{ steps.version.outputs.revision }}
          provenance: mode=max
          sbom: true
      - name: Prepare the standalone kit and release-bound one-line installer
        env:
          PUBLIC_VERSION: ${{ steps.version.outputs.version }}
          GATEWAY_DIGEST: ${{ steps.gateway.outputs.digest }}
        run: |
          python3 explorer/package_release.py --version "$PUBLIC_VERSION" \
            --gateway-image "ghcr.io/buckyos/usdb-explorer-gateway@$GATEWAY_DIGEST" --output-dir dist
          bash -n "dist/install-usdb-explorer-v$PUBLIC_VERSION.sh"
      - name: Plan digest scans for the complete explorer image lock
        id: security
        env:
          GATEWAY_DIGEST: ${{ steps.gateway.outputs.digest }}
        run: |
          python3 scripts/image_security.py plan \
            --gateway-image "ghcr.io/buckyos/usdb-explorer-gateway@$GATEWAY_DIGEST"
      - name: Create a reviewable draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          command = f'bash <(curl -fsSL https://github.com/buckyos/usdb-explorer/releases/download/{tag}/install-usdb-explorer-{tag}.sh)'
          notes = Path('explorer/RELEASE_NOTES.md').read_text()
          Path('public-release-notes.md').write_text(notes + '\n## 安装本版本\n\n'
              '草稿阶段下载链接不可用（HTTP 404）。维护者须先运行 `USDB Explorer Publish`，'
              f'在 `Use workflow from` 选择本版本 tag `{tag}`，无需额外填写版本；'
              '发布为 Pre-release 后以下命令才可用。\n\n```bash\n'
              + command + '\n```\n')
          with Path('public-release-notes.md').open('a') as notes:
              notes.write('\n## 镜像安全检查\n\n测试网漏洞结果为 report-only；镜像未因此获得安全验收。'
                  '构建流程的各镜像扫描 artifact 保存完整 JSON、SARIF、metadata 和 SHA256SUMS。'
                  '扫描或证据生成失败仍会阻止 Publish。\n')
          PY
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft \
            --title "$RELEASE_TAG" --notes-file public-release-notes.md
          {
            echo "### Public release draft: $RELEASE_TAG"
            echo 'Build and asset upload completed; public download URLs still return HTTP 404.'
            echo "Next: run USDB Explorer Publish with tag $RELEASE_TAG selected in 'Use workflow from'."
          } >>"$GITHUB_STEP_SUMMARY"

  security:
    name: Review ${{ matrix.name }} image
    needs: release
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release.outputs.security_matrix) }}
    uses: ./.github/workflows/release-image-security.yml
    with:
      image_name: ${{ matrix.name }}
      image_reference: ${{ matrix.image_reference }}
      source_revision: ${{ needs.release.outputs.source_revision }}
      enforcement: ${{ matrix.enforcement }}
