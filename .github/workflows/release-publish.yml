name: USDB Explorer Publish (select release tag)
run-name: Publish ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# Share the build lock so a tag build cannot change assets during publication.
concurrency:
  group: usdb-explorer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify existing public release assets
    if: github.repository == 'buckyos/usdb-explorer'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      fingerprint: ${{ steps.release.outputs.fingerprint }}
    steps:
      - name: Validate tag-scoped dispatch
        env:
          RELEASE_ID: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/tags/$RELEASE_ID" ]] || {
            echo "::error::Select a vX.Y.Z tag in 'Use workflow from'; current ref is $GITHUB_REF."
            exit 1
          }
          [[ "$RELEASE_ID" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?$ ]] || {
            echo "::error::Expected a vX.Y.Z release tag."
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve tag build and verify original assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
          RELEASE_ID: ${{ github.ref_name }}
        run: |
          python3 explorer/publish_release.py preflight --release-id "$RELEASE_ID" \
            --expected-source-revision "$GITHUB_SHA"

  publish:
    name: Approve and publish public pre-release
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: usdb-explorer-release
      url: ${{ steps.release.outputs.release_url }}
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reverify, publish existing assets and check anonymous downloads
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
          RELEASE_ID: ${{ github.ref_name }}
          EXPECTED_FINGERPRINT: ${{ needs.preflight.outputs.fingerprint }}
        run: |
          python3 explorer/publish_release.py publish --release-id "$RELEASE_ID" \
            --expected-source-revision "$GITHUB_SHA" \
            --expected-fingerprint "$EXPECTED_FINGERPRINT"
